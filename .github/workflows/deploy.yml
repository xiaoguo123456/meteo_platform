name: 部署晴川观象

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: 晴川观象生产部署
  cancel-in-progress: false

jobs:
  deploy:
    name: 构建并部署到单机服务器
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
      DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
      # 新服务器不跑 Open-Meteo，站点预测经白名单访问老服务器；见 docs/deployment.md。
      OPEN_METEO_ORIGIN: ${{ vars.OPEN_METEO_ORIGIN }}
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 配置 SSH
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          set -eu
          test -n "$DEPLOY_HOST"
          test -n "$DEPLOY_USER"
          test -n "$DEPLOY_KEY"
          : "${DEPLOY_PORT:=22}"
          : "${DEPLOY_PATH:=/opt/qingchuan}"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "$DEPLOY_PORT" -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts

      - name: 构建前端静态文件
        run: |
          set -eu
          cd frontend
          npm ci
          npm run build

      - name: 写入版本信息
        run: |
          set -eu
          # 部署包不含 .git，提前写入提交信息供 /api/version 核对线上版本。
          python3 - <<'PY'
          import json, subprocess
          from datetime import datetime, timezone
          git = lambda *args: subprocess.check_output(['git', *args], text=True).strip()
          info = dict(commit=git('rev-parse', 'HEAD'), committed_at=git('log', '-1', '--format=%cI'),
                      subject=git('log', '-1', '--format=%s'), built_at=datetime.now(timezone.utc).isoformat(),
                      run_id='${{ github.run_id }}')
          info['short'] = info['commit'][:7]
          open('backend/app/build_info.json', 'w').write(json.dumps(info, ensure_ascii=False))
          PY
          cat backend/app/build_info.json

      - name: 打包部署文件
        run: |
          tar --exclude='./.git' \
              --exclude='./.github' \
              --exclude='./backend/.env.news' \
              --exclude='./backend/.venv' \
              --exclude='./frontend/node_modules' \
              --exclude='./data' \
              -czf /tmp/qingchuan-release.tgz .

      - name: 上传并重建晴川观象
        run: |
          set -eu
          : "${DEPLOY_PORT:=22}"
          : "${DEPLOY_PATH:=/opt/qingchuan}"
          scp -i ~/.ssh/deploy_key -P "$DEPLOY_PORT" /tmp/qingchuan-release.tgz "$DEPLOY_USER@$DEPLOY_HOST:/tmp/qingchuan-release.tgz"
          # 以 sudo 执行，部署账号既可以是 root，也可以是有免密 sudo 的普通用户（如 ubuntu）。
          ssh -i ~/.ssh/deploy_key -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" "sudo DEPLOY_PATH='$DEPLOY_PATH' OPEN_METEO_ORIGIN='$OPEN_METEO_ORIGIN' bash -se" <<'EOF'
          set -eu
          install -d "$DEPLOY_PATH"
          tar --no-overwrite-dir -xzf /tmp/qingchuan-release.tgz -C "$DEPLOY_PATH"
          cd "$DEPLOY_PATH"
          # 仓库外的部署变量写在 deploy/.env，compose 自动读取；打包内容不含此文件，不会被覆盖成空。
          if [ -n "$OPEN_METEO_ORIGIN" ]; then printf 'OPEN_METEO_ORIGIN=%s\n' "$OPEN_METEO_ORIGIN" > deploy/.env; fi
          # 前端原先由 Docker Nginx 提供；先移除旧容器，释放 8091 给主机 Nginx。
          docker ps -aq --filter label=com.docker.compose.project=qingchuan --filter label=com.docker.compose.service=frontend | xargs -r docker rm -f
          docker compose -f deploy/compose.yml up -d --build backend news-worker
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y nginx certbot
          install -d /var/www/qingchuan
          find /var/www/qingchuan -mindepth 1 -maxdepth 1 -exec rm -rf {} +
          cp -a frontend/dist/. /var/www/qingchuan/
          # HTTP 入口始终启用（站点、API、证书校验与 8091 健康检查）；证书就绪后再叠加 HTTPS。
          install -D -m 644 deploy/nginx/qingchuan-site.conf /etc/nginx/snippets/qingchuan-site.conf
          install -D -m 644 deploy/nginx/qingchuan.conf /etc/nginx/sites-available/qingchuan
          ln -sfn /etc/nginx/sites-available/qingchuan /etc/nginx/sites-enabled/qingchuan
          rm -f /etc/nginx/sites-enabled/default
          nginx -t
          systemctl enable --now nginx
          systemctl reload nginx
          # 域名尚未解析到本机时签发会失败，不中断部署，站点仍可经 HTTP 访问；解析切过来后下次部署自动签发。
          certbot certonly --webroot -w /var/www/qingchuan -d meteo.weishenai.cn --cert-name meteo.weishenai.cn --non-interactive --agree-tos --register-unsafely-without-email --keep-until-expiring \
            || echo "证书签发未成功：meteo.weishenai.cn 可能尚未解析到本机，暂只提供 HTTP"
          install -d /etc/letsencrypt/renewal-hooks/deploy
          cat > /etc/letsencrypt/renewal-hooks/deploy/qingchuan-nginx-reload <<'HOOK'
          #!/bin/sh
          systemctl reload nginx
          HOOK
          chmod 755 /etc/letsencrypt/renewal-hooks/deploy/qingchuan-nginx-reload
          if [ -f /etc/letsencrypt/live/meteo.weishenai.cn/fullchain.pem ]; then
            install -D -m 644 deploy/nginx/qingchuan-https.conf /etc/nginx/sites-available/qingchuan-https
            ln -sfn /etc/nginx/sites-available/qingchuan-https /etc/nginx/sites-enabled/qingchuan-https
          else
            rm -f /etc/nginx/sites-enabled/qingchuan-https
          fi
          nginx -t
          systemctl reload nginx
          for i in $(seq 1 30); do
            if curl -fsS --max-time 3 http://127.0.0.1:8091/api/health >/dev/null; then break; fi
            sleep 2
          done
          curl -fsS --max-time 5 http://127.0.0.1:8091/api/health >/dev/null
          # 预热全量新能源区域预测缓存，避免生产重启后的首个用户等待模型批量计算。
          curl -fsS --max-time 180 'http://127.0.0.1:8091/api/power-outlook?hours=24' >/tmp/qingchuan-power-outlook.json
          docker compose -f deploy/compose.yml ps
          EOF

      - name: 清理临时密钥
        if: always()
        run: rm -f ~/.ssh/deploy_key /tmp/qingchuan-release.tgz
