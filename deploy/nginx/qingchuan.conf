# HTTP 入口，始终启用：域名尚未解析到本机、证书还没签下来时，站点和 API 也能经 80 端口访问，
# 测试子域名、直接用 IP 访问也走这里；HTTPS 证书就绪后由 qingchuan-https.conf 接管正式域名。
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    include /etc/nginx/snippets/qingchuan-site.conf;
}

# 保留 IP:8091 入口，部署流程的健康检查与迁移期间核验使用。
server {
    listen 8091;
    listen [::]:8091;
    server_name _;
    include /etc/nginx/snippets/qingchuan-site.conf;
}
