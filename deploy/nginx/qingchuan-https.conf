# 正式域名 HTTPS，仅在 Let's Encrypt 证书存在时由部署流程启用。
server {
    listen 80;
    listen [::]:80;
    server_name meteo.weishenai.cn;

    # 证书续期仍走 HTTP 校验，其余请求跳转 HTTPS。
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/qingchuan;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name meteo.weishenai.cn;

    ssl_certificate /etc/letsencrypt/live/meteo.weishenai.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/meteo.weishenai.cn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    include /etc/nginx/snippets/qingchuan-site.conf;
}
