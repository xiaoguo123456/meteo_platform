# 晴川观象站点公共配置：静态页面、API 反代与静态资源缓存，由 HTTP/HTTPS 两个 server 共同 include。
root /var/www/qingchuan;
index index.html;

# 跨境线路慢，静态文本压缩后体积约为原来的三分之一；系统默认只压缩 text/html。
gzip on;
gzip_vary on;
gzip_comp_level 6;
gzip_min_length 1024;
gzip_types text/css application/javascript text/javascript application/json application/geo+json image/svg+xml text/plain;

location ^~ /.well-known/acme-challenge/ {
    try_files $uri =404;
}

location = / {
    try_files /index.html =404;
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    add_header Pragma "no-cache" always;
    add_header Expires "0" always;
}

location = /index.html {
    try_files /index.html =404;
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    add_header Pragma "no-cache" always;
    add_header Expires "0" always;
}

location /api/ {
    proxy_pass http://127.0.0.1:18001;
    proxy_http_version 1.1;
    # 天气块是已经压缩的二进制流，关闭 Nginx 缓冲，收到一块就转发一块。
    # 这避免全球视野下等待整批数据后才开始显示，也避免重复 gzip。
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_cache off;
    # 后端已自行 gzip，Nginx 再压缩会缓冲流式数据块。
    gzip off;
    proxy_read_timeout 120s;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location /assets/ {
    try_files $uri =404;
    expires 30d;
    add_header Cache-Control "public, immutable";
}

# 系统 mime.types 没有 geojson，默认按二进制返回且不压缩。
location ~* \.geojson$ {
    types { }
    default_type application/geo+json;
    # 文件名不带哈希，缓存一天，过期后用 ETag 校验。
    expires 1d;
    try_files $uri =404;
}

location / {
    try_files $uri $uri/ /index.html;
}
